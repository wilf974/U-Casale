# Docker Compose pour le Développement Local
# Usage: docker compose -f docker-compose.dev.yml up

version: '3.8'

services:
  # PostgreSQL Database (dev)
  postgres:
    image: postgres:16-alpine
    container_name: ucasale_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ucasale
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: ucasale_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - ucasale_dev_network

  # Adminer - Database Management UI
  adminer:
    image: adminer
    container_name: ucasale_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - ucasale_dev_network
    depends_on:
      - postgres

networks:
  ucasale_dev_network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
